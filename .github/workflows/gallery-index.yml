# Gallery index drift gate (Security #176, MCP-Gallery M1 A2; CEO Q16, 2026-10-18: approved for 2.7).
# The platform installs only what .abs/gallery-index.json declares at a pinned commit, so the index must never diverge
# from the manifests. This job regenerates the index in memory and fails on any difference or rule miss. It is HARD
# once it is a required status check in the develop/main branch protection (a repository setting).
name: gallery-index

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify gallery-index.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Regenerate in memory and compare
        shell: pwsh
        run: ./.abs/generate-index.ps1 -Verify
